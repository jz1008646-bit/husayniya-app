  <script>
    /* =========================================================================
       1. إعدادات Firebase العامة (استبدل القيم ببيانات مشروعك من Firebase Console)
       ملاحظة: إذا بقيت القيم الافتراضية، يعمل التطبيق بحفظ محلي متكامل تلقائياً.
       ========================================================================= */
    const FIREBASE_CONFIG = {
      apiKey: "YOUR_FIREBASE_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.firebasestorage.app",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    let fbAuth = null;
    let fbDb = null;
    const isFirebaseConfigured = FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith("YOUR_");

    if (isFirebaseConfigured && window.firebase) {
      try {
        firebase.initializeApp(FIREBASE_CONFIG);
        fbAuth = firebase.auth();
        fbDb = firebase.firestore();
      } catch (e) {
        console.warn("Firebase init skipped:", e);
      }
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /* =========================================================================
       2. نظام الحظر الصارم لكل ما هو خارج إطار الدين الإسلامي
       ========================================================================= */
    const BLOCKED_PATTERNS = [
      /(?:https?:\/\/|www\.|t\.me\/|wa\.me\/|instagram\.com|tiktok\.com|snapchat\.com)/i,
      /(?:أغاني|اغاني|موسيقى|مطرب|طرب|رقص|فيلم|مسلسل|سينما|تيك توك|ببجي|فورتنايت|لعبة|كازينو|مراهنات|قمار|كورة|مباراة|دوري|ريال مدريد|برشلونة)/i,
      /(?:حب وغرام|عشق وغرام|تعال خاص|تعارف|بيع وشراء|إعلان ممول|خصم|تخفيضات|عملات رقمية|فوركس|تداول)/i,
      /(?:شتم|قذف|فحش|إباحي|سافل|وقح)/i
    ];
    const RELIGIOUS_HINTS = /(?:الله|رب|قرآن|آية|سورة|حديث|رواية|دعاء|زيارة|نبي|رسول|محمد|علي|فاطمة|حسن|حسين|زينب|عباس|مهدي|صادق|باقر|كاظم|رضا|سجاد|صلاة|صوم|زكاة|خمس|حج|فقه|عقيدة|توحيد|منطق|نحو|حوزة|علم|إيمان|تقوى|أخلاق|جنة|توبة|استغفار|تسبيح|كربلاء|نجف|كاظمية|سامراء|مشهد|بقيع|سلام|رحمة|حلال|حرام|واجب|مستحب|كتاب|درس|مؤمن|إسلام|شيعة|أهل البيت)/;

    function moderateReligiousText(text) {
      const clean = (text || "").trim();
      if (clean.length < 3) {
        return { allowed: false, reason: "النص قصير جداً." };
      }
      for (const pat of BLOCKED_PATTERNS) {
        if (pat.test(clean)) {
          return {
            allowed: false,
            reason: "محتوى محظور: يُمنع نشر الروابط أو المواضيع الترفيهية والتجارية أو أي كلام خارج إطار الدين والأخلاق."
          };
        }
      }
      if (!RELIGIOUS_HINTS.test(clean)) {
        return {
          allowed: false,
          reason: "محتوى محظور: يُسمح فقط بالنشر ضمن الإطار الديني الإسلامي أو العلمي الحوزوي والأخلاقي."
        };
      }
      return { allowed: true, reason: "" };
    }

    /* =========================================================================
       3. حالة التطبيق والبيانات
       ========================================================================= */
    const state = {
      section: 'home',
      isDark: localStorage.getItem('husayni_theme') === 'dark',
      tasbihCount: Number(localStorage.getItem('husayni_tasbih_daily') || 0),
      tasbihTarget: 34,
      tasbihStep: 0,
      cityIndex: 0,
      surahId: 1,
      quranFilter: 'all',
      surahsList: [],
      surahAyahs: [],
      reciter: 'Parhizgar_48kbps',
      playingAyahIdx: -1,
      isPlayingSurah: false,
      user: JSON.parse(localStorage.getItem('husayni_demo_user') || 'null'),
      stories: JSON.parse(localStorage.getItem('husayni_stories') || '[]'),
      topics: JSON.parse(localStorage.getItem('husayni_topics') || '[]'),
      profiles: JSON.parse(localStorage.getItem('husayni_profiles') || '[]'),
      follows: JSON.parse(localStorage.getItem('husayni_follows') || '[]'),
      activeQuizIdx: 0,
      quizScore: 0
    };

    if (state.isDark) document.documentElement.classList.add('dark');

    // بيانات ابتدائية عامة للعرض في حال لم يُربط مشروع Firebase خاص بعد
    if (state.profiles.length === 0) {
      state.profiles = [
        { userId: 'u1', displayName: 'السيد علي الموسوي', studyStage: 'طالب سطوح', city: 'النجف الأشرف', bio: 'مهتم بمباحث الفقه الاستدلالي وأصول المظفر والحلقات.' },
        { userId: 'u2', displayName: 'الشيخ حسن العاملي', studyStage: 'أستاذ وباحث', city: 'كربلاء المقدسة', bio: 'باحث في التفسير الموضوعي وسيرة أهل البيت (عليهم السلام).' },
        { userId: 'u3', displayName: 'زينب الكاظمي', studyStage: 'قارئ ومحب', city: 'بغداد - الكاظمية', bio: 'مواظبة على تلاوة القرآن والأدعية المأثورة في الصحيفة السجادية.' }
      ];
      localStorage.setItem('husayni_profiles', JSON.stringify(state.profiles));
    }
    if (state.stories.length === 0) {
      state.stories = [
        { id: 'st1', authorId: 'u1', authorName: 'السيد علي الموسوي', category: 'آية وتأمل', caption: '﴿أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ﴾ — كلما ضاقت بك الدنيا فافزع إلى ذكر الله ومناجاته.', reference: 'سورة الرعد · آية ٢٨', theme: 'emerald' },
        { id: 'st2', authorId: 'u2', authorName: 'الشيخ حسن العاملي', category: 'حديث مأثور', caption: 'قال الإمام الصادق (عليه السلام): «كُونُوا لَنَا زَيْناً وَلَا تَكُونُوا عَلَيْنَا شَيْناً».', reference: 'الأمالي للصدوق', theme: 'amber' }
      ];
      localStorage.setItem('husayni_stories', JSON.stringify(state.stories));
    }
    if (state.topics.length === 0) {
      state.topics = [
        { id: 'tp1', title: 'منهجية دراسة المنطق للمبتدئين في الحوزة', body: 'ما هي أفضل طريقة لضبط أبواب التصورات والتصديقات في كتاب منطق المظفر قبل الانتقال إلى السطوح؟', category: 'منطق ونحو', authorId: 'u1', authorName: 'السيد علي الموسوي', replies: [{ authorName: 'الشيخ حسن العاملي', body: 'يُستحسن تلخيص الكليات الخمس والقضايا مع حل تمارين نهاية كل فصل ومباحثة زميل في الدرس.' }] }
      ];
      localStorage.setItem('husayni_topics', JSON.stringify(state.topics));
    }

    const SECTIONS = [
      { id: 'home', label: 'الرئيسية' },
      { id: 'duas', label: 'الأدعية والأحاديث' },
      { id: 'quran', label: 'القرآن (١١٤ سورة)' },
      { id: 'places', label: 'الأماكن الدينية' },
      { id: 'figures', label: 'الصحابة والعلماء' },
      { id: 'library', label: 'الكتب الكاملة' },
      { id: 'forum', label: 'ساحة المناقشة' },
      { id: 'profile', label: 'الملف والمتابعة' },
      { id: 'prayers', label: 'الصلوات والأذان' },
      { id: 'tasbih', label: 'التسبيحات' },
      { id: 'nawafil', label: 'النوافل' },
      { id: 'lessons', label: 'الدروس' },
      { id: 'qa', label: 'أسئلة وأجوبة' },
      { id: 'quiz', label: 'المسابقات' }
    ];

    const DUAS = [
      { title: 'دعاء الفرج (الإمام المهدي عج)', source: 'مفاتيح الجنان', text: 'اللَّهُمَّ كُنْ لِوَلِيِّكَ الْحُجَّةِ بْنِ الْحَسَنِ، صَلَوَاتُكَ عَلَيْهِ وَعَلَى آبَائِهِ، فِي هَذِهِ السَّاعَةِ وَفِي كُلِّ سَاعَةٍ، وَلِيّاً وَحَافِظاً، وَقَائِداً وَنَاصِراً، وَدَلِيلاً وَعَيْناً، حَتَّى تُسْكِنَهُ أَرْضَكَ طَوْعاً، وَتُمَتِّعَهُ فِيهَا طَوِيلاً.' },
      { title: 'مقطع من زيارة عاشوراء', source: 'كامل الزيارات ومفاتيح الجنان', text: 'السَّلَامُ عَلَيْكَ يَا أَبَا عَبْدِ اللَّهِ، السَّلَامُ عَلَيْكَ يَا ابْنَ رَسُولِ اللَّهِ، السَّلَامُ عَلَيْكَ يَا خِيَرَةَ اللَّهِ وَابْنَ خِيَرَتِهِ، السَّلَامُ عَلَيْكَ يَا ثَارَ اللَّهِ وَابْنَ ثَارِهِ وَالْوِتْرَ الْمَوْتُورَ.' },
      { title: 'مطلع دعاء كميل بن زياد', source: 'مفاتيح الجنان', text: 'اللَّهُمَّ إِنِّي أَسْأَلُكَ بِرَحْمَتِكَ الَّتِي وَسِعَتْ كُلَّ شَيْءٍ، وَبِقُوَّتِكَ الَّتِي قَهَرْتَ بِهَا كُلَّ شَيْءٍ، وَخَضَعَ لَهَا كُلُّ شَيْءٍ، وَذَلَّ لَهَا كُلُّ شَيْءٍ... اللَّهُمَّ اغْفِرْ لِيَ الذُّنُوبَ الَّتِي تَهْتِكُ الْعِصَمَ، اللَّهُمَّ اغْفِرْ لِيَ الذُّنُوبَ الَّتِي تُنْزِلُ النِّقَمَ.' },
      { title: 'مقطع من دعاء التوسل', source: 'بحار الأنوار · المجلسي', text: 'اللَّهُمَّ إِنِّي أَسْأَلُكَ وَأَتَوَجَّهُ إِلَيْكَ بِنَبِيِّكَ نَبِيِّ الرَّحْمَةِ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَآلِهِ، يَا أَبَا الْقَاسِمِ يَا رَسُولَ اللَّهِ يَا إِمَامَ الرَّحْمَةِ يَا سَيِّدَنَا وَمَوْلَانَا إِنَّا تَوَجَّهْنَا وَاسْتَشْفَعْنَا وَتَوَسَّلْنَا بِكَ إِلَى اللَّهِ.' }
    ];

    const HADITHS = [

    function renderRibbon() {
      const el = document.getElementById('subRibbon');
      el.innerHTML = SECTIONS.map(s => `
        <button type="button" onclick="navigate('${s.id}')" class="min-h-[40px] px-3.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap shrink-0 cursor-pointer transition-colors ${
          state.section === s.id
            ? 'bg-[#0F5132] text-white dark:bg-emerald-600'
            : 'text-stone-700 dark:text-stone-300 hover:bg-stone-100 dark:hover:bg-slate-800'
        }">${s.label}</button>
      `).join('');
    }

    function navigate(sec) {
      state.section = sec;
      renderRibbon();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleTheme() {
      state.isDark = !state.isDark;
      document.documentElement.classList.toggle('dark', state.isDark);
      localStorage.setItem('husayni_theme', state.isDark ? 'dark' : 'light');
    }

    function openModal(html) {
      document.getElementById('modalCard').innerHTML = html;

      document.getElementById('modalOverlay').classList.add('hidden');
    }

            <span>${escapeHtml(st.authorName)} · ${escapeHtml(st.category)}</span>

    function submitStory(e) {
      e.preventDefault();
      const cap = document.getElementById('storyCaption').value.trim();
      const ref = document.getElementById('storyRef').value.trim();
      const cat = document.getElementById('storyCategory').value;
      const check = moderateReligiousText(cap + ' ' + ref);
      if (!check.allowed) {
        const errEl = document.getElementById('storyError');
        errEl.textContent = check.reason;
        errEl.classList.remove('hidden');
        return;
      }
      const authorName = state.user?.displayName || 'قارئ كريم';
      const newStory = { id: 'st_' + Date.now(), authorId: state.user?.uid || 'guest', authorName, category: cat, caption: cap, reference: ref, theme: 'emerald' };
      state.stories.unshift(newStory);
      localStorage.setItem('husayni_stories', JSON.stringify(state.stories));
      if (fbDb && fbAuth?.currentUser) {
        fbDb.collection('stories').doc(newStory.id).set({
          ...newStory,
          authorId: fbAuth.currentUser.uid,
          themeColor: 'emerald',
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          expiresAt: firebase.firestore.Timestamp.fromMillis(Date.now() + 86400000)
        }).catch(() => {});
      }
      closeModal();
      render();
    }

    async function loadQuranSurah(id) {
      state.surahId = id;
      render();
      try {
        const r = await fetch(`https://api.alquran.cloud/v1/surah/${id}/editions/quran-uthmani,ar.muyassar`);
        const j = await r.json();
        const u = j.data[0].ayahs;
        const t = j.data[1].ayahs;
        state.surahAyahs = u.map((a, i) => ({ number: a.numberInSurah, text: a.text, tafsir: t[i]?.text || '' }));
        render();
      } catch {
        state.surahAyahs = [{ number: 1, text: 'تعذر التحميل من الإنترنت، تحقق من الاتصال.', tafsir: '' }];
        render();
      }
    }

    function openAyahModal(idx) {
      const a = state.surahAyahs[idx];
      if (!a) return;
      openModal(`
        <div class="space-y-5">
          <div class="flex items-center justify-between border-b pb-3">
            <span class="text-xs font-bold text-[#0F5132]">سورة رقم ${state.surahId} · الآية ${a.number}</span>
            <button type="button" onclick="closeModal()" class="px-3 py-1 rounded-lg border cursor-pointer">إغلاق</button>
          </div>
          <div class="rounded-2xl bg-[#FAF8F4] dark:bg-[#0B1117] p-6 text-center">
            <p class="font-amiri text-3xl leading-[2.3]">﴿${a.text}﴾</p>
          </div>
          <p class="text-sm leading-relaxed text-stone-700 dark:text-stone-300">${a.tafsir}</p>
          <div class="flex gap-2">
            <button type="button" onclick="playSingleAyah(${state.surahId}, ${a.number})" class="min-h-[44px] px-4 py-2 rounded-xl bg-[#0F5132] text-white text-xs font-semibold cursor-pointer">استماع بصوت القارئ المختار</button>
          </div>
        </div>
      `);
    }

    const quranAudio = new Audio();
    quranAudio.onended = () => {
      if (state.isPlayingSurah && state.playingAyahIdx + 1 < state.surahAyahs.length) {
        state.playingAyahIdx++;
        const nextAyah = state.surahAyahs[state.playingAyahIdx];
        playSingleAyah(state.surahId, nextAyah.number, true);
        render();
      } else {
        state.isPlayingSurah = false;
        state.playingAyahIdx = -1;
        render();
      }
    };

    function playSingleAyah(sId, aNum, keepSeq = false) {
      if (!keepSeq) state.isPlayingSurah = false;
      const idx = state.surahAyahs.findIndex(x => x.number === aNum);
      if (idx >= 0) state.playingAyahIdx = idx;
      const url = `https://everyayah.com/data/${state.reciter}/${String(sId).padStart(3,'0')}${String(aNum).padStart(3,'0')}.mp3`;
      quranAudio.src = url;
      quranAudio.play().catch(() => {});
    }

    function playSurahSequential() {
      if (!state.surahAyahs.length) return;
      state.isPlayingSurah = true;
      state.playingAyahIdx = 0;
      playSingleAyah(state.surahId, state.surahAyahs[0].number, true);
      render();
    }

    function stopQuranAudio() {
      quranAudio.pause();
      state.isPlayingSurah = false;
      state.playingAyahIdx = -1;
      render();
    }

    function playAdhan() {
      const synth = window.speechSynthesis;
      if (!synth) return;
      synth.cancel();
      const u = new SpeechSynthesisUtterance('اللَّهُ أَكْبَرُ، أَشْهَدُ أَنْ لَا إِلَهَ إِلَّا اللَّهُ، أَشْهَدُ أَنَّ مُحَمَّداً رَسُولُ اللَّهِ، أَشْهَدُ أَنَّ عَلِيّاً وَلِيُّ اللَّهِ، حَيَّ عَلَى الصَّلَاةِ، حَيَّ عَلَى الْفَلَاحِ، حَيَّ عَلَى خَيْرِ الْعَمَلِ');
      u.lang = 'ar-SA';
      u.rate = 0.85;
      synth.speak(u);
    }

              <li>• نافلة الفجر: ركعتان قبل صلاة الفجر.</li>
              <li>• نافلة الظهر: ٨ ركعات (ركعتان ركعتان) قبل صلاة الظهر.</li>
              <li>• نافلة العصر: ٨ ركعات قبل صلاة العصر.</li>
              <li>• نافلة المغرب: ٤ ركعات بعد صلاة المغرب.</li>
              <li>• نافلة العشاء (الوتيرة): ركعتان من جلوس بعد صلاة العشاء.</li>
              <li>• صلاة الليل: ١١ ركعة (٨ نافلة الليل + ٢ الشفع + ١ الوتر).</li>
            </ul>
          </div>
        `;
      } else if (state.section === 'lessons') {
        main.innerHTML = `
          <div class="space-y-4">
            <h1 class="font-amiri text-3xl font-bold">دروس الفقه والعقيدة والمنطق والنحو</h1>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${LESSONS.map(l => `<div class="rounded-2xl border border-[#E7E1D6] dark:border-[#1F2B37] bg-white dark:bg-[#121A22] p-6 space-y-2"><p class="text-xs font-semibold text-[#0F5132]">${l.cat}</p><h2 class="font-amiri text-2xl font-bold">${l.title}</h2><p class="text-sm leading-relaxed">${l.body}</p></div>`).join('')}
            </div>
          </div>
        `;
      } else if (state.section === 'qa') {
        main.innerHTML = `
          <div class="space-y-4">
            <h1 class="font-amiri text-3xl font-bold">الأسئلة والأجوبة الفقهية والعقائدية</h1>
            ${QA_LIST.map(item => `<div class="rounded-2xl border border-[#E7E1D6] dark:border-[#1F2B37] bg-white dark:bg-[#121A22] p-6 space-y-2"><h2 class="font-bold text-base text-[#0F5132]">${item.q}</h2><p class="text-sm leading-relaxed">${item.a}</p></div>`).join('')}
          </div>
        `;
      } else if (state.section === 'quiz') {
        const q = QUIZ[state.activeQuizIdx];
        main.innerHTML = `
          <div class="max-w-xl mx-auto rounded-2xl border border-[#E7E1D6] dark:border-[#1F2B37] bg-white dark:bg-[#121A22] p-6 space-y-4">
            <div class="flex justify-between text-xs font-bold text-[#0F5132]">
              <span>السؤال ${state.activeQuizIdx + 1} من ${QUIZ.length}</span>
              <span>النقاط: ${state.quizScore}</span>
            </div>
            <h1 class="font-amiri text-2xl font-bold">${q.q}</h1>
            <div class="space-y-2">
              ${q.opts.map((opt, idx) => `<button type="button" onclick="answerQuiz(${idx})" class="w-full text-right min-h-[44px] px-4 py-2 rounded-xl border hover:border-[#0F5132] text-sm cursor-pointer">${opt}</button>`).join('')}
            </div>
          </div>
        `;
      }
    }

    function openBookModal(i) {
      const b = BOOKS[i];
      openModal(`
        <div class="space-y-4">
          <div class="flex items-start justify-between border-b pb-3">
            <div><p class="text-xs font-semibold text-[#0F5132]">${b.stage} · ${b.author}</p><h2 class="font-amiri text-2xl font-bold">${b.title}</h2></div>
            <button type="button" onclick="closeModal()" class="px-3 py-1 rounded-lg border cursor-pointer">إغلاق</button>
          </div>
          <p class="font-amiri text-xl leading-[2.1] whitespace-pre-wrap">${b.fullText}</p>
        </div>
      `);
    }

    function openNewTopicModal() {
      openModal(`
        <form onsubmit="submitTopic(event)" class="space-y-4">
          <div class="flex items-center justify-between pb-3 border-b border-[#E7E1D6] dark:border-[#1F2B37]">
            <h3 class="font-amiri text-2xl font-bold">طرح موضوع في ساحة المناقشة</h3>
            <button type="button" onclick="closeModal()" class="px-3 py-1 rounded-lg border cursor-pointer">إغلاق</button>
          </div>
          <p id="topicErr" class="hidden text-xs font-semibold text-rose-600 bg-rose-50 p-3 rounded-xl"></p>
          <select id="topCategory" class="w-full min-h-[44px] px-3 rounded-xl border bg-[#FAF8F4] dark:bg-[#0B1117] text-sm">
            <option value="فقهية">فقهية</option>
            <option value="عقائدية">عقائدية</option>
            <option value="منطق ونحو">منطق ونحو</option>
            <option value="قرآن وتفسير">قرآن وتفسير</option>
          </select>
          <input id="topTitle" required placeholder="عنوان البحث أو السؤال الديني..." class="w-full min-h-[44px] px-3.5 rounded-xl border bg-[#FAF8F4] dark:bg-[#0B1117] text-sm" />
          <textarea id="topBody" required rows="4" placeholder="التفاصيل (يُحظر أي محتوى خارج إطار الدين)..." class="w-full p-3.5 rounded-xl border bg-[#FAF8F4] dark:bg-[#0B1117] text-sm"></textarea>
          <button type="submit" class="w-full min-h-[44px] rounded-xl bg-[#0F5132] text-white text-sm font-semibold cursor-pointer">نشر الموضوع</button>
        </form>
      `);
    }

    function submitTopic(e) {
      e.preventDefault();
      const title = document.getElementById('topTitle').value.trim();
      const body = document.getElementById('topBody').value.trim();
      const category = document.getElementById('topCategory').value;
      const check = moderateReligiousText(title + ' ' + body);
      if (!check.allowed) {
        const el = document.getElementById('topicErr');
        el.textContent = check.reason;
        el.classList.remove('hidden');
        return;
      }
      const newTopic = {
        id: 'tp_' + Date.now(),
        title,
        body,
        category,
        authorId: state.user?.uid || 'guest',
        authorName: state.user?.displayName || 'قارئ كريم',
        replies: []
      };
      state.topics.unshift(newTopic);
      localStorage.setItem('husayni_topics', JSON.stringify(state.topics));
      if (fbDb && fbAuth?.currentUser) {
        fbDb.collection('discussions').doc(newTopic.id).set({
          title,
          body,
          category,
          authorId: fbAuth.currentUser.uid,
          authorName: fbAuth.currentUser.displayName || newTopic.authorName,
          repliesCount: 0,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).catch(() => {});
      }
      closeModal();
      render();
    }

    function openTopicModal(i) {
      const t = state.topics[i];
      if (!t) return;
      openModal(`
        <div class="space-y-4">
          <div class="flex justify-between border-b pb-3"><h3 class="font-amiri text-2xl font-bold">${escapeHtml(t.title)}</h3><button type="button" onclick="closeModal()" class="px-3 py-1 rounded-lg border cursor-pointer">إغلاق</button></div>
          <p class="text-sm leading-relaxed">${escapeHtml(t.body)}</p>
          <div class="space-y-2 border-t pt-3">
            ${(t.replies||[]).map(r => `<div class="p-3 rounded-xl bg-[#FAF8F4] dark:bg-[#0B1117] text-xs"><strong>${escapeHtml(r.authorName)}:</strong> ${escapeHtml(r.body)}</div>`).join('')}
          </div>
          <form onsubmit="submitReply(event, ${i})" class="space-y-2">
            <p id="repErr" class="hidden text-xs text-rose-600"></p>
            <div class="flex gap-2">
              <input id="repInput" required placeholder="أضف رداً علمياً..." class="flex-1 min-h-[44px] px-3 rounded-xl border bg-[#FAF8F4] dark:bg-[#0B1117] text-sm" />
              <button type="submit" class="min-h-[44px] px-4 rounded-xl bg-[#0F5132] text-white text-xs font-semibold cursor-pointer">إرسال</button>
            </div>
          </form>
        </div>
      `);
    }

    function submitReply(e, idx) {
      e.preventDefault();
      const txt = document.getElementById('repInput').value.trim();
      const check = moderateReligiousText(txt);
      if (!check.allowed) {
        const el = document.getElementById('repErr');
        el.textContent = check.reason;
        el.classList.remove('hidden');
        return;
      }
      const replyObj = { authorName: state.user?.displayName || 'قارئ كريم', body: txt };
      state.topics[idx].replies.push(replyObj);
      localStorage.setItem('husayni_topics', JSON.stringify(state.topics));
      if (fbDb && fbAuth?.currentUser) {
        fbDb.collection('discussions').doc(state.topics[idx].id).collection('replies').add({
          body: txt,
          authorId: fbAuth.currentUser.uid,
          authorName: fbAuth.currentUser.displayName || replyObj.authorName,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }).catch(() => {});
      }
      openTopicModal(idx);
    }

    function openEditProfileModal() {
      openModal(`
        <form onsubmit="saveProfile(event)" class="space-y-4">
          <div class="flex items-center justify-between pb-3 border-b border-[#E7E1D6] dark:border-[#1F2B37]">
            <h3 class="font-amiri text-2xl font-bold">إعداد الملف الشخصي</h3>
            <button type="button" onclick="closeModal()" class="px-3 py-1 rounded-lg border cursor-pointer">إغلاق</button>
          </div>
          <p id="profErr" class="hidden text-xs font-semibold text-rose-600 bg-rose-50 p-3 rounded-xl"></p>
          <input id="profName" required value="${escapeHtml(state.user?.displayName || '')}" placeholder="الاسم الظاهر" class="w-full min-h-[44px] px-3 rounded-xl border bg-[#FAF8F4] dark:bg-[#0B1117] text-sm" />
          <select id="profStage" class="w-full min-h-[44px] px-3 rounded-xl border bg-[#FAF8F4] dark:bg-[#0B1117] text-sm">
            <option value="قارئ ومحب">قارئ ومحب</option>
            <option value="طالب مقدمات">طالب مقدمات</option>
            <option value="طالب سطوح">طالب سطوح</option>
            <option value="أستاذ وباحث">أستاذ وباحث</option>
          </select>
          <input id="profCity" value="${escapeHtml(state.user?.city || 'كربلاء المقدسة')}" placeholder="المدينة" class="w-full min-h-[44px] px-3 rounded-xl border bg-[#FAF8F4] dark:bg-[#0B1117] text-sm" />
          <textarea id="profBio" rows="3" placeholder="نبذة علمية أو دينية (ضمن الإطار الديني فقط)..." class="w-full p-3 rounded-xl border bg-[#FAF8F4] dark:bg-[#0B1117] text-sm">${escapeHtml(state.user?.bio || '')}</textarea>
          <button type="submit" class="w-full min-h-[44px] rounded-xl bg-[#0F5132] text-white text-sm font-semibold cursor-pointer">حفظ الملف</button>
        </form>
      `);
    }

    function saveProfile(e) {
      e.preventDefault();
      const name = document.getElementById('profName').value.trim();
      const stage = document.getElementById('profStage').value;
      const city = document.getElementById('profCity').value.trim();
      const bio = document.getElementById('profBio').value.trim();
      if (bio.length > 0) {
        const check = moderateReligiousText(bio + ' علم دين');
        if (!check.allowed) {
          const el = document.getElementById('profErr');
          el.textContent = check.reason;
          el.classList.remove('hidden');
          return;
        }
      }
      const uid = fbAuth?.currentUser?.uid || 'me';
      state.user = { uid, displayName: name, city, bio, studyStage: stage };
      localStorage.setItem('husayni_demo_user', JSON.stringify(state.user));
      const idx = state.profiles.findIndex(p => p.userId === uid);
      const rec = { userId: uid, displayName: name, city, bio: bio || 'عضو في المدونة الحسينية.', studyStage: stage };
      if (idx >= 0) state.profiles[idx] = rec; else state.profiles.unshift(rec);
      localStorage.setItem('husayni_profiles', JSON.stringify(state.profiles));
      if (fbDb && fbAuth?.currentUser) {
        fbDb.collection('profiles').doc(uid).set({
          ...rec,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true }).catch(() => {});
      }
      closeModal();
      render();
    }

    function toggleFollow(uid) {
      const wasFollowing = state.follows.includes(uid);
      if (wasFollowing) {
        state.follows = state.follows.filter(id => id !== uid);
      } else {
        state.follows.push(uid);
      }
      localStorage.setItem('husayni_follows', JSON.stringify(state.follows));
      if (fbDb && fbAuth?.currentUser && uid !== fbAuth.currentUser.uid) {
        const followId = fbAuth.currentUser.uid + '_' + uid;
        if (wasFollowing) {
          fbDb.collection('follows').doc(followId).delete().catch(() => {});
        } else {
          fbDb.collection('follows').doc(followId).set({
            followerId: fbAuth.currentUser.uid,
            targetId: uid,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          }).catch(() => {});
        }
      }
      render();
    }

    async function signInWithGoogle() {
      if (!fbAuth || !window.firebase) return;
      try {
        const provider = new firebase.auth.GoogleAuthProvider();
        await fbAuth.signInWithPopup(provider);
      } catch (e) {
        console.warn('Google sign-in skipped:', e);
      }
    }

    async function signOutFirebase() {
      if (!fbAuth) return;
      await fbAuth.signOut();
    }

    if (isFirebaseConfigured && fbAuth && fbDb) {
      fbAuth.onAuthStateChanged(user => {
        if (user) {
          state.user = { uid: user.uid, displayName: user.displayName || 'طالب علم', city: 'كربلاء المقدسة', bio: '', studyStage: 'قارئ ومحب' };
          fbDb.collection('follows').where('followerId', '==', user.uid).onSnapshot(snap => {
            state.follows = snap.docs.map(d => d.data().targetId);
            render();
          });
        }
        render();
      });
      fbDb.collection('stories').orderBy('createdAt', 'desc').limit(30).onSnapshot(snap => {
        if (!snap.empty) {
          state.stories = snap.docs.map(d => ({ id: d.id, ...d.data() }));
          render();
        }
      });
      fbDb.collection('profiles').orderBy('updatedAt', 'desc').limit(50).onSnapshot(snap => {
        if (!snap.empty) {
          state.profiles = snap.docs.map(d => ({ userId: d.id, ...d.data() }));
          render();
        }
      });
      fbDb.collection('discussions').orderBy('createdAt', 'desc').limit(30).onSnapshot(snap => {
        if (!snap.empty) {
          state.topics = snap.docs.map(d => ({ id: d.id, replies: [], ...d.data() }));
          render();
        }
      });
    }

    function tapTasbih() {
      state.tasbihCount++;
      if (state.tasbihCount === 34 || state.tasbihCount === 67 || state.tasbihCount >= 100) {
        state.tasbihStep++;
      }
      localStorage.setItem('husayni_tasbih_daily', String(state.tasbihCount));
      render();
    }

    function answerQuiz(idx) {
      if (idx === QUIZ[state.activeQuizIdx].ans) state.quizScore++;
      if (state.activeQuizIdx < QUIZ.length - 1) {
        state.activeQuizIdx++;
        render();
      } else {
        openModal(`<div class="text-center space-y-4"><h2 class="font-amiri text-3xl font-bold">أحسنت!</h2><p class="text-lg">نتيجتك: ${state.quizScore} من ${QUIZ.length}</p><button type="button" onclick="state.activeQuizIdx=0;state.quizScore=0;closeModal();render()" class="min-h-[44px] px-6 py-2 rounded-xl bg-[#0F5132] text-white cursor-pointer">إعادة المسابقة</button></div>`);
      }
    }

    renderRibbon();
    render();
  </script>
</body>
</html>
